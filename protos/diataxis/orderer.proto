syntax = "proto3";

package diataxis;

option go_package = "github.com/katastroma/diataxis";

// OrdererService sorts Kubernetes manifests by dependency.
service OrdererService {
  rpc Order(stream OrderRequest) returns (stream OrderResponse);
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_FORWARD = 1;
  DIRECTION_REVERSED = 2;
}

// OrdererType identifies which ordering backend to use.
enum OrdererType {
  ORDERER_TYPE_UNSPECIFIED = 0;
  ORDERER_TYPE_CLI_UTILS = 1;
  ORDERER_TYPE_HELM = 2;
}

// Kubernetes manifest data.
message OrderRequest {
  bytes data = 1;
}

// Streamed ordered Kubernetes manifest.
message OrderResponse {
  bytes manifest = 1;
}
